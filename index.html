<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon Setup - ULTRA-LARGE ICONS for Maximum Visibility -->
    <!-- Browsers will select the LARGEST size that fits their needs -->
    <!-- Prioritized: Largest first = Better quality on high-DPI displays -->
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    
    <!-- Legacy ICO upgraded to 64x64 for better visibility -->
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon for iOS/macOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA Manifest (includes 192x192 and 512x512 icons) -->
    <link rel="manifest" href="/site.webmanifest" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>SSS Super Speciality Hospital - Best Healthcare in Erode</title>
    
    <!-- Professional Font System - Industry Grade Typography -->
    <!-- Primary: Inter (UI, Body) - Used by: GitHub, Stripe, Vercel, Linear -->
    <!-- Secondary: Plus Jakarta Sans (Headings) - Used by: Modern healthcare sites, SaaS products -->
    <!-- Optimized loading: preconnect + display=swap for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
